name: FARISS RACING GAME - Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    name: Extract project and build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager was not found under $ANDROID_HOME/cmdline-tools"
            exit 1
          fi
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Extract uploaded project ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="FARISS_RACING_GAME.zip"
          if [ ! -f "$ZIP_FILE" ]; then
            echo "::error::FARISS_RACING_GAME.zip was not found at repository root."
            ls -la
            exit 1
          fi
          mkdir -p extracted_project
          unzip -oq "$ZIP_FILE" -d extracted_project
          echo "Extracted ZIP contents:"
          find extracted_project -maxdepth 4 -type f | head -n 100

      - name: Locate Android Gradle project
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          SETTINGS_FILE="$(find extracted_project \
            -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -not -path '*/.gradle/*' \
            -not -path '*/build/*' \
            -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::The ZIP was extracted, but no settings.gradle or settings.gradle.kts was found. Check that FARISS_RACING_GAME.zip contains the complete Android project, not another ZIP or only images/source snippets."
            echo "Extracted file list:"
            find extracted_project -maxdepth 5 -type f | head -n 200
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          PROJECT_DIR="$(cd "$PROJECT_DIR" && pwd)"
          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "::error::Found settings.gradle but app/build.gradle is missing from the same project root."
            ls -la "$PROJECT_DIR"
            exit 1
          fi
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Found Android project at: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Build APK
        run: gradle --no-daemon -p "${{ steps.locate.outputs.project_dir }}" assembleDebug

      - name: Collect APK
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.locate.outputs.project_dir }}
        run: |
          set -euo pipefail
          APK_PATH="$(find "$PROJECT_DIR" -type f -path '*/build/outputs/apk/debug/*.apk' -print -quit)"
          if [ -z "$APK_PATH" ]; then
            echo "::error::Build finished but no debug APK was found."
            exit 1
          fi
          mkdir -p release
          cp "$APK_PATH" release/FARISS_RACING_GAME.apk
          ls -lh release/FARISS_RACING_GAME.apk

      - name: Upload FARISS RACING GAME
        uses: actions/upload-artifact@v4
        with:
          name: FARISS_RACING_GAME
          path: release/FARISS_RACING_GAME.apk
          if-no-files-found: error
          retention-days: 90
